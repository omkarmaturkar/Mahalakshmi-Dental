name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Create signing key (first time only)
        run: |
          if [ ! -f app/clinic.keystore ]; then
            keytool -genkeypair -keystore app/clinic.keystore -alias clinic \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass mahalakshmi123 -keypass mahalakshmi123 \
              -dname "CN=Mahalakshmi Dental Clinic, C=IN"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/clinic.keystore
            git commit -m "Add signing key"
            git push
          fi

      - name: Show SHA-1 (needed once for Google Drive setup)
        run: keytool -list -v -keystore app/clinic.keystore -alias clinic -storepass mahalakshmi123 | grep -E "SHA1|SHA256"

      - name: Add clinic logo
        run: |
          shopt -s nullglob nocaseglob
          files=( *.png *.jpg *.jpeg *.webp )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Logo not found. Upload your logo image (PNG or JPG) to the main page of the repository."
            exit 1
          fi
          logo="${files[0]}"
          mime=$(file --mime-type -b "$logo")
          case "$mime" in
            image/png) ext=png ;;
            image/jpeg) ext=jpg ;;
            image/webp) ext=webp ;;
            *) echo "::error::The logo must be a PNG or JPG image (found $mime)."; exit 1 ;;
          esac
          mkdir -p app/src/main/res/drawable-xxhdpi
          cp "$logo" "app/src/main/res/drawable-xxhdpi/clinic_logo.$ext"
          echo "Using logo: $logo"

      - name: Download fonts
        run: |
          mkdir -p app/src/main/res/font
          for w in Regular Medium SemiBold Bold; do
            name=$(echo "$w" | tr '[:upper:]' '[:lower:]')
            curl -fsSL -o "app/src/main/res/font/poppins_$name.ttf" \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-$w.ttf"
          done

      - name: Build the APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d $HOME/gradle
          $HOME/gradle/gradle-8.11.1/bin/gradle assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: Mahalakshmi-Dental-APK
          path: app/build/outputs/apk/release/*.apk
